<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bring your photo to life</title>
  <style>
    :root { --pink:#ff4d8d; --bg:#000; --muted:#a7a7a7; --line:#2a2a2a; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#000; color:#fff; font-family:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    button, input, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    .nav { height:64px; display:flex; align-items:center; gap:28px; padding:0 22px; background:#000; position:sticky; top:0; z-index:20; flex-wrap:nowrap; overflow-x:auto; }
    .brand { width:28px; height:28px; border-radius:9px; background:linear-gradient(180deg,#ff6ea2,#ff2f78); display:grid; place-items:center; font-weight:800; flex:none; }
    .nav a { font-size:15px; color:#f2f2f2; flex:none; white-space:nowrap; }
    .nav a.active { color:var(--pink); font-weight:700; }
    .try { margin-left:auto; background:#fff; color:#111; border:0; border-radius:999px; height:36px; padding:0 16px; font-weight:700; flex:none; white-space:nowrap; }
    .screen { display:none; min-height:calc(100vh - 64px); }
    .screen.on { display:block; }
    .split { display:grid; grid-template-columns:1fr 1fr; height:calc(100vh - 64px); }
    .stage { position:relative; background:#111; height:100%; overflow:hidden; }
    .stage img, .stage video, .thumb img, .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
    .home-still { object-position:center center; }
    .badge { position:absolute; left:16px; top:16px; background:rgba(18,18,18,.72); border-radius:999px; padding:6px 12px; font-size:12px; }
    .x { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:42px; height:42px; border-radius:50%; border:0; background:rgba(0,0,0,.55); color:#fff; font-size:18px; }
    .composer { background:#000; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:28px 28px 34px; }
    .label { color:var(--pink); font-size:13px; font-weight:700; margin-bottom:8px; }
    textarea { width:100%; min-height:52px; resize:vertical; background:#1a1a1a; border:0; border-radius:12px; padding:14px 16px; outline:none; }
    .cta, .upload, .generate { width:100%; height:52px; border-radius:14px; margin-top:12px; font-weight:750; }
    .cta { border:0; color:#fff; background:linear-gradient(90deg,#ff6a45 0%, #ff4f78 58%, #ff3d92 100%); }
    .upload { background:#141414; border:1px solid #2e2e2e; }
    .checks { display:flex; gap:16px; margin-top:12px; color:#bdbdbd; font-size:12px; }
    .status { min-height:20px; margin-top:8px; color:#ffb4c8; font-size:13px; }
    .tools { display:grid; grid-template-columns:332px 1fr; height:calc(100vh - 64px); }
    .gallery { height:100%; overflow:auto; }
    .rail { padding:18px 16px 28px; background:#0b0b0b; border-right:1px solid #161616; }
    .thumb { position:relative; height:210px; border-radius:18px; overflow:hidden; background:#111; }
    .thumb img, .thumb video { object-fit:cover; object-position:center 18%; background:#111; }
    .effect { font-size:30px; line-height:1.05; font-weight:800; color:var(--pink); margin:14px 0; }
    .drop { border:1px dashed #3a3a3a; border-radius:18px; min-height:168px; display:grid; place-items:center; text-align:center; background:#141414; color:#ddd; padding:16px; }
    .drop strong { display:block; margin-bottom:4px; }
    .drop span { color:#9a9a9a; font-size:13px; }
    .generate { border:0; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#6a4454; color:#efe4e8; }
    .generate.ready { background:linear-gradient(90deg,#c94b73,#ff4d88); color:#fff; }
    .gem { color:#ff8ab5; }
    .gallery, .page { padding:26px 28px 64px; }
    .mega { margin:0; font-size:78px; line-height:.88; letter-spacing:-.045em; font-weight:800; color:#ff8ab8; text-shadow:0 0 28px rgba(255,70,140,.45); }
    .sub { color:#cfcfcf; margin:12px 0 16px; }
    .pills { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
    .pills button, .tabs button { background:#222; border:0; border-radius:999px; padding:8px 13px; }
    .pills button.on, .tabs button.on { background:#fff; color:#111; font-weight:700; }
    .heart { width:34px; height:34px; border-radius:50%; border:0; background:#1c1c1c; }
    .grid { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; }
    .card { position:relative; border:0; padding:0; border-radius:16px; overflow:hidden; background:#151515; text-align:left; aspect-ratio:3/4; }
    .card video, .card img { width:100%; height:100%; object-fit:cover; display:block; }
    .card b { position:absolute; left:12px; right:36px; bottom:12px; font-size:16px; text-shadow:0 2px 10px #000; }
    .card .save { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(0,0,0,.45); }
    .card.selected { outline:2px solid var(--pink); outline-offset:-2px; }
    .ribbon { position:absolute; left:10px; top:10px; background:#111; border-radius:8px; padding:4px 7px; font-size:10px; letter-spacing:.06em; }
    .explore-top { position:relative; min-height:52px; margin-bottom:26px; }
    .finder { max-width:680px; margin:0 auto; background:#171717; border-radius:999px; display:flex; align-items:center; gap:10px; padding:12px 16px; }
    .continue { position:absolute; right:0; top:6px; border:1px solid #333; border-radius:999px; padding:8px 14px; font-size:13px; white-space:nowrap; }
    .finder em { color:var(--pink); font-style:normal; font-size:12px; font-weight:800; letter-spacing:.06em; }
    .finder input { flex:1; background:transparent; border:0; outline:none; }
    .kicker { color:var(--pink); font-size:12px; font-weight:800; letter-spacing:.08em; margin:0 0 6px; }
    h2 { margin:0 0 14px; font-size:34px; letter-spacing:-.03em; }
    .row { display:flex; gap:14px; overflow:auto; padding-bottom:8px; margin-bottom:28px; }
    .story { flex:0 0 250px; height:320px; border:0; padding:0; border-radius:16px; overflow:hidden; position:relative; background:#151515; text-align:left; }
    .story video, .story img { width:100%; height:100%; object-fit:cover; }
    .story div { position:absolute; left:0; right:0; bottom:0; padding:14px; background:linear-gradient(transparent, rgba(0,0,0,.85)); }
    .story small { display:block; color:#ddd; margin-top:4px; }
    .story .tag, .story i { position:absolute; right:12px; border-radius:999px; background:rgba(0,0,0,.62); font-style:normal; font-size:11px; font-weight:700; padding:4px 8px; }
    .story .tag { top:12px; }
    .story i { top:40px; letter-spacing:.04em; }
    .cat { position:relative; height:168px; border:0; border-radius:18px; overflow:hidden; padding:0; }
    .cat video, .cat img { width:100%; height:100%; object-fit:cover; filter:brightness(.55); }
    .cat-count { position:absolute; top:12px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.08em; font-weight:700; }
    .cat-label { position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); width:108px; min-height:92px; border-radius:18px; background:rgba(8,8,8,.78); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
    .cat-label b { font-size:15px; letter-spacing:.04em; }
    .cat-label em { color:#ff4d8d; font-style:normal; font-size:11px; font-weight:800; }
    .cats { display:grid; grid-template-columns:repeat(6, minmax(140px,1fr)); gap:12px; margin-bottom:28px; }
    .library-head { font-size:64px; margin:8px 0 16px; letter-spacing:-.04em; }
    .jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .job { background:#141414; border-radius:16px; overflow:hidden; }
    .job video, .job img { width:100%; aspect-ratio:3/4; object-fit:cover; background:#000; }
    .job p { margin:0; padding:12px 12px 16px; }
    .empty { color:#c8c8c8; margin-top:48px; }
    .empty h3 { margin:0 0 6px; font-size:22px; }
    .lock { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.45); font-weight:800; letter-spacing:.06em; }
    .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.72); display:grid; place-items:center; z-index:30; }
    .modal { width:min(440px, calc(100vw - 32px)); background:#161616; border-radius:20px; padding:22px; }
    .modal h2 { margin:0 0 8px; font-size:28px; }
    .modal p { color:#cfcfcf; margin:0 0 14px; }
    .pack { width:100%; height:48px; border:0; border-radius:12px; margin-top:8px; background:#fff; color:#111; font-weight:750; }
    .modal .fine { color:#9a9a9a; font-size:12px; margin-top:14px; }
    @media (max-width:980px) {
      .split, .tools, .grid, .cats { grid-template-columns:1fr 1fr; }
      .tools { grid-template-columns:1fr; }
      .mega, .library-head { font-size:46px; }
      .stage, .split { min-height:70vh; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="brand">M</div>
    <a href="/" data-route="home">Home</a>
    <a href="/explore" data-route="explore">Explore</a>
    <a href="/video-generator" data-route="tools">AI Tools</a>
    <a href="/creative-studio" data-route="play">Play</a>
    <a href="/history" data-route="library">Library</a>
    <button class="try" data-route="tools" id="credits">Try Free</button>
  </header>
  <main id="app"></main>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <script>
    const templates = [
      { id: "soft-sway", name: "Soft Sway", category: "Motion", face: "a", credits: 20, prompt: "A natural smile, a small nod, and a slow camera push-in.", file: "soft-sway.mp4", still: "/media/placeholder-ai-portrait.jpg" },
      { id: "glam-turn", name: "Shoulder Turn", category: "Motion", face: "a", credits: 20, prompt: "A shoulder turn, fabric moving, camera holding steady.", file: "glam-turn.mp4" },
      { id: "runway-walk", name: "Walk Toward Camera", category: "Featured", face: "a", credits: 30, prompt: "A steady walk toward the camera, full body, even pace.", file: "runway-walk.mp4" },
      { id: "dance-loop", name: "Dance Loop", category: "Featured", face: "a", credits: 30, prompt: "A short dance loop, stable framing, natural movement.", file: "dance-loop.mp4" },
      { id: "blow-kiss", name: "Blow a Kiss", category: "Sway", face: "b", credits: 20, prompt: "Look at the camera, smile, and blow a kiss.", file: "blow-a-kiss.mp4" },
      { id: "couple-chemistry", name: "Couple Glance", category: "Sway", face: "b", credits: 20, prompt: "Two adults share a warm glance and move slightly closer.", file: "couple-chemistry.mp4", still: "/media/musemotion-couple.png" }
    ];
    const categories = ["My Effects", "Motion", "Featured", "Sway"];
    const stories = [
      ["soft-sway", "Hold Still", "A portrait that starts to breathe."],
      ["runway-walk", "Down the Line", "A full-body walk, no cut, no rush."],
      ["dance-loop", "Eight Counts", "The same phrase, looped until it feels easy."],
      ["glam-turn", "The Turn", "One shoulder turn, then back to the camera."]
    ];
    const pathOf = { home: "/", explore: "/explore", tools: "/video-generator", play: "/creative-studio", library: "/history" };
    const shareHost = !(location.hostname === "127.0.0.1" || location.hostname === "localhost");
    function appBase() {
      const path = location.pathname.replace(/\/index\.html$/, "");
      const cut = path.search(/\/(explore|video-generator|creative-studio|history)\/?$/);
      return (cut >= 0 ? path.slice(0, cut) : path.replace(/\/$/, ""));
    }
    function routeFromLocation() {
      const path = location.pathname;
      if (path.endsWith("/explore")) return "explore";
      if (path.endsWith("/video-generator")) return "tools";
      if (path.endsWith("/creative-studio")) return "play";
      if (path.endsWith("/history")) return "library";
      return "home";
    }
    function readShareAccount() {
      try { return JSON.parse(localStorage.getItem("studio-share-account") || ""); }
      catch { return { unlocked: false, credits: 300, items: [] }; }
    }
    function writeShareAccount(account) {
      localStorage.setItem("studio-share-account", JSON.stringify(account));
    }
    const hearts = new Set(JSON.parse(localStorage.getItem("studio-hearts") || "[]"));
    const state = {
      route: routeFromLocation(),
      template: templates[0],
      category: "Motion",
      file: null,
      previewUrl: "",
      resultUrl: "",
      busy: false,
      status: "",
      adult: false,
      rights: false,
      showConsent: false,
      playPrompt: "",
      query: "",
      libraryTab: "video",
      items: [],
      remaining: null,
      notice: "",
      unlocked: false,
      recharge: false
    };

    const asset = (path) => `${appBase()}${path.startsWith("/") ? path : "/" + path}`;
    const clip = (item) => asset(`/media/previews/${item.file}`);
    const locked = (item) => item.face === "b" && !state.unlocked;
    const visible = () => {
      if (state.category === "My Effects") return templates.filter((item) => hearts.has(item.id) && !locked(item));
      if (state.category === "Featured") return templates.filter((item) => item.face === "a" && (item.category === "Featured" || item.category === "Motion"));
      if (state.category === "Motion") return templates.filter((item) => item.category === "Motion");
      return templates.filter((item) => item.category === state.category);
    };
    const promptValue = () => state.route === "play" ? state.playPrompt : state.template.prompt;
    const stageMedia = (item, homeStill) => {
      if (state.resultUrl) return `<video src="${state.resultUrl}" autoplay loop controls playsinline></video>`;
      if (state.previewUrl) return `<img src="${state.previewUrl}" alt="">`;
      if (homeStill && item.still) return `<img class="home-still" src="${asset(item.still)}" alt="">`;
      return `<video src="${clip(item)}" autoplay muted loop playsinline></video>`;
    };
    const card = (item) => `<article class="card ${item.id === state.template.id ? "selected" : ""}" data-id="${item.id}">
      <video src="${clip(item)}" muted loop autoplay playsinline></video>
      <button class="save" data-heart="${item.id}" aria-label="Save">${hearts.has(item.id) ? "♥" : "♡"}</button>
      ${locked(item) ? `<span class="lock">LOCKED</span>` : ""}
      <b>${item.name}</b></article>`;
    const composer = (play) => `<div class="label">✦ ${play ? "Play Prompt" : "Motion Prompt"}</div>
      <textarea data-prompt placeholder="${play ? "Describe the motion" : ""}">${promptValue()}</textarea>
      <button class="cta" data-action="generate">${state.busy ? "Rendering…" : "Make It Move · Free"}</button>
      <button class="upload" data-action="pick">Upload your own photo</button>
      ${state.showConsent ? `<div class="checks"><label><input data-check="adult" type="checkbox" ${state.adult ? "checked" : ""}> Adult</label><label><input data-check="rights" type="checkbox" ${state.rights ? "checked" : ""}> I can use this photo</label></div>` : ""}
      <div class="status" data-status>${state.status}</div>`;

    function rechargeModal() {
      if (!state.recharge) return "";
      return `<div class="modal-back" data-action="close-recharge"><section class="modal">
        <h2>Unlock the adult side</h2>
        <p>General motion stays on the front. A top-up unlocks the adult templates.</p>
        <button class="pack" data-pack="5">$5 · 100 credits</button>
        <button class="pack" data-pack="10">$10 · 250 credits</button>
        <button class="pack" data-pack="20">$20 · 600 credits</button>
        <p class="fine">This confirms the unlock on this computer. No card is charged. Generations still use SpicyX and stay inside today’s $20 cap. Minors and non-consensual requests stay blocked.</p>
      </section></div>`;
    }
    function shell() {
      const item = state.template;
      if (state.route === "home" || state.route === "play") {
        const play = state.route === "play";
        return `<section class="screen on"><div class="split">
          <div class="stage" data-stage>${stageMedia(item, true)}<div class="badge">${state.previewUrl ? "Your photo" : "Example photo · upload to use your own"}</div></div>
          <div class="composer">${composer(play)}</div>
        </div></section>`;
      }
      if (state.route === "tools") {
        const list = visible().filter((entry) => entry.name.toLowerCase().includes(state.query.toLowerCase()));
        return `<section class="screen on"><div class="tools">
          <aside class="rail">
            <div class="thumb">${stageMedia(item, false)}${state.previewUrl ? `<button class="x" data-action="clear">×</button>` : ""}</div>
            <div class="effect">${item.name}</div>
            <div class="drop" data-action="pick"><div><strong>${state.file ? state.file.name : "Upload your photo"}</strong><span>${state.file ? "Ready to generate" : "Drag and drop or click to upload"}</span></div></div>
            <button class="generate ${state.file && !state.busy ? "ready" : ""}" data-action="generate"><span>${state.busy ? "Rendering…" : "Generate"}</span><span><span class="gem">◆</span> ${item.credits}</span></button>
            ${state.showConsent ? `<div class="checks"><label><input data-check="adult" type="checkbox" ${state.adult ? "checked" : ""}> Adult</label><label><input data-check="rights" type="checkbox" ${state.rights ? "checked" : ""}> I can use this photo</label></div>` : ""}
            <div class="status" data-status>${state.status}</div>
          </aside>
          <div class="gallery">
            <h1 class="mega">${state.category.toUpperCase()}</h1>
            <p class="sub">A curated set of motion templates. One photo in, a clip out.</p>
            <div class="pills"><button class="heart" data-action="mine">${hearts.size ? "♥" : "♡"}</button>${categories.filter((name) => name !== "My Effects").map((name) => `<button data-cat="${name}" class="${name === state.category ? "on" : ""}">${name}</button>`).join("")}</div>
            <div class="grid">${list.map(card).join("") || `<p class="empty">Save a motion with the heart to see it here.</p>`}</div>
          </div>
        </div></section>`;
      }
      if (state.route === "explore") {
        const found = templates.filter((entry) => `${entry.name} ${entry.prompt}`.toLowerCase().includes(state.query.toLowerCase()));
        const counts = Object.fromEntries(["Motion", "Featured", "Sway"].map((name) => [name, templates.filter((entry) => entry.category === name).length]));
        return `<section class="screen on page">
          <div class="explore-top">
            <div class="finder"><span>⌕</span><em>FEATURE FINDER</em><input data-find placeholder="${templates[1].name}" value="${state.query}"><span>›</span></div>
            <a class="continue" href="/video-generator" data-route="tools">Continue your story</a>
          </div>
          <p class="kicker">STORYCAST</p><h2>STORYCAST</h2>
          <div class="row">${stories.map(([id, title, text]) => {
            const story = templates.find((entry) => entry.id === id);
            const media = story.still ? `<img src="${asset(story.still)}" alt="">` : `<video src="${clip(story)}" muted loop autoplay playsinline></video>`;
            return `<button class="story" data-id="${id}">${media}<em class="tag">AVAILABLE</em><i>1 CLIP</i><div><b>${title}</b><small>${text}</small></div></button>`;
          }).join("")}</div>
          <p class="kicker">CATEGORIES</p><h2>EXPLORE BY CATEGORY</h2>
          <div class="cats">${["Motion", "Featured", "Sway"].map((name) => {
            const sample = templates.find((entry) => entry.category === name) || templates[0];
            const media = sample.still ? `<img src="${asset(sample.still)}" alt="">` : `<video src="${clip(sample)}" muted autoplay loop playsinline></video>`;
            const open = name !== "Sway" || state.unlocked;
            return `<button class="cat" data-cat="${name}">${media}<span class="cat-count">${counts[name]} TEMPLATES</span><span class="cat-label"><b>${name.toUpperCase()}</b><em>${open ? "OPEN" : "LOCKED"}</em></span></button>`;
          }).join("")}</div>
          <p class="kicker">TEMPLATES</p><h2>MOTION TEMPLATES</h2>
          <p class="sub">${found.length} motions you can run from one photo.</p>
          <div class="grid">${found.map(card).join("")}</div>
        </section>`;
      }
      const items = state.items.filter((item) => state.libraryTab === "image" ? item.kind === "image" : item.kind !== "image");
      return `<section class="screen on page">
        <h1 class="library-head">LIBRARY</h1>
        <div class="tabs"><button data-tab="video" class="${state.libraryTab === "video" ? "on" : ""}">Videos</button> <button data-tab="image" class="${state.libraryTab === "image" ? "on" : ""}">Images</button></div>
        ${items.length ? `<div class="jobs">${items.map((item) => `<article class="job">${item.outputUrl ? (item.kind === "image" ? `<img src="${item.outputUrl}" alt="">` : `<video src="${item.outputUrl}" controls playsinline></video>`) : `<img src="${asset("/media/musemotion-hero.png")}" alt="">`}<p>${templates.find((entry) => entry.id === item.templateId)?.name || "Render"} · ${item.status}${item.errorMessage ? " · " + item.errorMessage : ""}</p></article>`).join("")}</div>` : `<div class="empty"><h3>No history found</h3><p>Your ${state.libraryTab === "image" ? "image" : "video"} history will appear here.</p></div>`}
      </section>`;
    }

    function paintNav() {
      document.querySelectorAll(".nav a").forEach((link) => link.classList.toggle("active", link.dataset.route === state.route));
    }
    function render() {
      paintNav();
      document.querySelector("#app").innerHTML = shell() + rechargeModal();
    }
    function go(route) {
      state.route = route;
      history.pushState({}, "", appBase() + pathOf[route]);
      if (route === "library") loadLibrary();
      else render();
    }
    function setStatus(text) {
      state.status = text;
      document.querySelectorAll("[data-status]").forEach((node) => node.textContent = text);
    }
    function choose(id) {
      const next = templates.find((item) => item.id === id);
      if (!next) return;
      if (locked(next)) { state.recharge = true; render(); return; }
      state.template = next;
      state.resultUrl = "";
      if (state.route === "explore") go("tools");
      else render();
    }
    async function loadLibrary() {
      if (shareHost) {
        state.items = readShareAccount().items || [];
        render();
        return;
      }
      const data = await (await fetch("/api/library")).json();
      state.items = data.items || [];
      render();
    }
    async function generate() {
      if (state.busy) return;
      if (!state.file) { setStatus("Upload your own photo first."); document.querySelector("#file").click(); return; }
      if (!state.adult || !state.rights) {
        state.showConsent = true;
        render();
        setStatus("Before generating, confirm the person is an adult and you can use the photo.");
        return;
      }
      if (shareHost) {
        const blocked = /\b(child|minor|underage|schoolgirl|schoolboy|nude|naked|explicit sex|rape|non-?consensual)\b|未成年|幼女|幼童|萝莉|正太|儿童|小孩|小学生|初中生|loli|shota/i;
        if (blocked.test(promptValue())) {
          setStatus("This demo does not support minors or non-consensual content.");
          return;
        }
        state.resultUrl = clip(state.template);
        const account = readShareAccount();
        account.items = [{ templateId: state.template.id, kind: "video", status: "sample", outputUrl: state.resultUrl }, ...(account.items || [])].slice(0, 12);
        writeShareAccount(account);
        setStatus("Shared preview. This plays the sample clip, not a new generation.");
        render();
        return;
      }
      state.busy = true;
      render();
      setStatus("Uploading…");
      try {
        const form = new FormData();
        form.append("file", state.file);
        const uploadResponse = await fetch("/api/uploads", { method: "POST", body: form });
        const uploadBody = await uploadResponse.json();
        if (!uploadResponse.ok) throw new Error(uploadBody.error || "Upload failed");
        setStatus("Making it move…");
        const response = await fetch("/api/generations", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            templateId: state.template.id,
            assetIds: [uploadBody.asset.id],
            prompt: promptValue(),
            aspectRatio: "9:16",
            quality: "standard",
            acceptedAge: true,
            acceptedRights: true
          })
        });
        const data = await response.json();
        if (data.code === "adult_locked") { state.recharge = true; throw new Error(data.error); }
        if (!response.ok) throw new Error(data.error || "Could not start");
        let job = data.generation;
        const started = Date.now();
        while ((job.status === "queued" || job.status === "processing") && Date.now() - started < 180000) {
          await new Promise((resolve) => setTimeout(resolve, 3000));
          job = (await (await fetch("/api/generations/" + job.id)).json()).generation;
          setStatus(job.status === "processing" ? "Making it move…" : job.status);
        }
        if (job.outputUrl) {
          state.resultUrl = job.outputUrl;
          setStatus("Done. It’s in Library.");
        } else throw new Error(job.errorMessage || "No video came back");
      } catch (error) {
        setStatus(error.message);
      } finally {
        state.busy = false;
        render();
      }
    }

    document.body.addEventListener("click", (event) => {
      const route = event.target.closest("[data-route]");
      if (route) { event.preventDefault(); go(route.dataset.route); return; }
      const heart = event.target.closest("[data-heart]");
      if (heart) {
        event.stopPropagation();
        hearts.has(heart.dataset.heart) ? hearts.delete(heart.dataset.heart) : hearts.add(heart.dataset.heart);
        localStorage.setItem("studio-hearts", JSON.stringify([...hearts]));
        render();
        return;
      }
      const picked = event.target.closest("[data-id]");
      if (picked) { choose(picked.dataset.id); return; }
      const pack = event.target.closest("[data-pack]");
      if (pack) { recharge(Number(pack.dataset.pack)); return; }
      const cat = event.target.closest("[data-cat]");
      if (cat) {
        if (cat.dataset.cat === "Sway" && !state.unlocked) { state.recharge = true; render(); return; }
        state.category = cat.dataset.cat;
        if (state.route === "explore") go("tools");
        else render();
        return;
      }
      const tab = event.target.closest("[data-tab]");
      if (tab) { state.libraryTab = tab.dataset.tab; render(); return; }
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "pick") document.querySelector("#file").click();
      if (action === "clear") {
        if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
        state.file = null; state.previewUrl = ""; state.resultUrl = "";
        render();
      }
      if (action === "mine") { state.category = "My Effects"; render(); }
      if (action === "generate") generate();
      if (action === "close-recharge" && event.target.classList.contains("modal-back")) { state.recharge = false; render(); }
    });
    document.body.addEventListener("input", (event) => {
      if (event.target.matches("[data-prompt]")) {
        if (state.route === "play") state.playPrompt = event.target.value;
        else state.template.prompt = event.target.value;
      }
      if (event.target.matches("[data-find]")) {
        const pos = event.target.selectionStart;
        state.query = event.target.value;
        render();
        const next = document.querySelector("[data-find]");
        if (next) { next.focus(); next.setSelectionRange(pos, pos); }
      }
    });
    document.body.addEventListener("change", (event) => {
      if (event.target.matches("[data-check]")) state[event.target.dataset.check === "adult" ? "adult" : "rights"] = event.target.checked;
    });
    document.querySelector("#file").addEventListener("change", () => {
      const file = document.querySelector("#file").files[0];
      if (!file) return;
      if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      state.file = file;
      state.previewUrl = URL.createObjectURL(file);
      state.resultUrl = "";
      render();
    });
    document.body.addEventListener("dragover", (event) => { if (event.target.closest(".drop")) event.preventDefault(); });
    document.body.addEventListener("drop", (event) => {
      const zone = event.target.closest(".drop");
      if (!zone) return;
      event.preventDefault();
      const file = event.dataTransfer.files[0];
      if (!file) return;
      if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
      state.file = file;
      state.previewUrl = URL.createObjectURL(file);
      state.resultUrl = "";
      render();
    });
    window.addEventListener("popstate", () => { state.route = routeFromLocation(); render(); });
    render();
    function openPaidSide(credits) {
      state.unlocked = true;
      state.recharge = false;
      state.category = "Sway";
      state.template = templates.find((item) => item.face === "b");
      state.route = "tools";
      history.pushState({}, "", appBase() + "/video-generator");
      document.querySelector("#credits").textContent = `${credits} credits`;
      render();
    }
    async function recharge(amountUsd) {
      if (shareHost) {
        const added = { 5: 100, 10: 250, 20: 600 }[amountUsd] || 100;
        const account = readShareAccount();
        account.unlocked = true;
        account.credits = Number(account.credits || 300) + added;
        account.items = account.items || [];
        writeShareAccount(account);
        openPaidSide(account.credits);
        return;
      }
      const response = await fetch("/api/recharge", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ amountUsd }) });
      const data = await response.json();
      if (!response.ok) { setStatus(data.error || "Top-up failed"); return; }
      openPaidSide(data.credits);
    }
    if (shareHost) {
      const account = readShareAccount();
      state.unlocked = Boolean(account.unlocked);
      document.querySelector("#credits").textContent = state.unlocked ? `${account.credits || 300} credits` : "Try Free";
      render();
    } else {
      fetch("/api/session").then((response) => response.json()).then((data) => {
        state.unlocked = Boolean(data.profile?.adultUnlocked);
        if (data.profile?.credits != null) document.querySelector("#credits").textContent = state.unlocked ? `${data.profile.credits} credits` : "Try Free";
        render();
      }).catch(() => {});
      fetch("/api/health").then((response) => response.json()).then((data) => {
        state.remaining = data.budget?.remainingUsd;
      }).catch(() => {});
    }
  </script>
</body>
</html>
